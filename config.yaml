

# Slicing
toolpath_width: 0.4  # Width of the toolpath in mm
layer_height: 1.0  # Height of each layer in mm

# Toolpath optimizer parameters
max_points_per_segment: 1000  # Maximum points per segment when splitting paths
tsp_scale_factor: 100  # Scale factor for concorde TSP solver distances

# Debugging
max_layers_to_process: 5  # Maximum number of layers to process for testing
