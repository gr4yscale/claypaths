
### Testing
max_layers_to_process: 1                # For quicker test cycles

### Print settings (shared)

# Width of the toolpath in mm
toolpath_width: 0.2
# Height of each layer in mm
layer_height: 0.5

# Number of perimeter walls to generate
perimeter_count: 1



### Model loader

# the full 3d mesh
visualize_stl_mesh: False



### Slicer

# outer contour polygon for a layer slice 
visualize_layer_contours: False
# debug polygonization failures
visualize_problematic_segments: False



### Region fill

# The region fill path before optimization
visualize_fill_paths: True

region_fill_algorithm: "hybrid_contour_zigzag" # Contour offset first, then zigzag for remaining areas
#region_fill_algorithm: "enhanced_contour"      # Contour offsetting + local fills for remaining areas
#region_fill_algorithm: "zigzag"                # Simple back-and-forth lines
#region_fill_algorithm: "contour"               # Continuous contour offsetting inwards
#region_fill_algorithm: "fermat_spiral"         # Continuous Fermat spiral from the center outwards
#region_fill_algorithm: "hilbert"               # Hilbert curve space-filling pattern

# Multiplier for toolpath_width^2 to determine minimum area for contour fill loops
contour_min_area_multiplier: 4.0

### Toolpath optimizer

# Whether to run the toolpath optimization step
enable_toolpath_optimization: True
toolpath_optimizer: 'OptimizerA'

optimizer_c_resolution: 0.8       # Pixel size for image processing (mm)
optimizer_c_gaussian_sigma: 1.5   # Sigma for Gaussian blur
visualize_optimizer_c_binary_image:  False # Show the rasterized layer shape
visualize_optimizer_c_filtered_image: False # Show the Gaussian blurred image
visualize_optimizer_c_graph:  False # Show the graph nodes and start/end points (can be slow)


# path generated by toolpath optimizer
visualize_optimized_paths: True
# distance between end point of prev layer and start point of current
visualize_layer_transitions: False
# Maximum points per segment when splitting paths
max_points_per_segment: 1000
# Scale factor for concorde TSP solver distances
tsp_scale_factor: 100
# Distance between points in smoothed path (mm)
path_smoothing_segment_length: 0.5



### GCode generator
generate_gcode: False                   # Whether to generate GCode output
gcode_flavor: "klipper"                 # GCode flavor, either "klipper" or "marlin"
print_speed: 20                         # Movement speed in mm/s
acceleration: 500                       # Acceleration in mm/s²
