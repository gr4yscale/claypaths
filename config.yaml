
# Testing
max_layers_to_process: 5                # For quicker test cycles

# Print settings (shared)
toolpath_width: 0.4                     # Width of the toolpath in mm
layer_height: 1.0                       # Height of each layer in mm

# Slicer
visualize_layer_contours: False         # outer contour polygon for a layer slice 
visualize_problematic_segments: False   # only useful when polygonization fails

# Toolpath optimizer
visualize_optimized_paths: True         # path generated by toolpath optimizer
visualize_layer_transitions: False      # distance between end point of prev layer and start point of current
max_points_per_segment: 1000            # Maximum points per segment when splitting paths
tsp_scale_factor: 100                   # Scale factor for concorde TSP solver distances

# Region fill
visualize_fill_paths: False             # The region fill path before optimization

# Model loader
visualize_stl_mesh: False               # the full 3d mesh

# GCode generator
generate_gcode: True                    # Whether to generate GCode output
gcode_flavor: "klipper"                 # GCode flavor, either "klipper" or "marlin"
travel_speed: 20                        # Travel speed in mm/s
print_speed: 20                         # Print speed in mm/s
acceleration: 500                       # Acceleration in mm/s²
z_lift: 2                               # Z lift height in mm
